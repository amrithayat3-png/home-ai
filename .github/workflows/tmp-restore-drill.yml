name: tmp-restore-drill

# One-off drill: take a fresh backup of the live database, restore it into an EMPTY throwaway
# database inside this runner, then compare every table with the live one.
# The live database is only read. Nothing is restored into it. Only counts and hashes are printed.

on:
  push:
    branches:
      - chore/restore-drill

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: composer setup
      - run: php artisan test

  drill:
    runs-on: ubuntu-latest
    services:
      scratch:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: drillpass
          POSTGRES_DB: restore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: production
      BACKUP_AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_AWS_ACCESS_KEY_ID }}
      BACKUP_AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_AWS_SECRET_ACCESS_KEY }}
      BACKUP_AWS_DEFAULT_REGION: ${{ secrets.BACKUP_AWS_DEFAULT_REGION }}
      BACKUP_AWS_BUCKET: ${{ secrets.BACKUP_AWS_BUCKET }}
      BACKUP_AWS_ENDPOINT: ${{ secrets.BACKUP_AWS_ENDPOINT }}
      BACKUP_AWS_USE_PATH_STYLE_ENDPOINT: 'true'
    steps:
      - name: Temporary app key
        run: echo "APP_KEY=base64:$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: PostgreSQL 18 tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, intl, zip
          tools: composer:v2
          coverage: none
      - run: composer install --no-dev --no-interaction --no-scripts --prefer-dist

      - name: 1. Fresh backup of the live database (read only)
        env:
          DB_CONNECTION: pgsql
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSLMODE: require
        run: php artisan db:backup --no-prune

      - name: 2. What is in the backup bucket
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan db:backup:list

      - name: 3. Restore the newest copy into the EMPTY throwaway database
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: restore_test
          DB_USERNAME: postgres
          DB_PASSWORD: drillpass
          DB_SSLMODE: disable
          ALLOW_DB_RESTORE: 'true'
          BACKUP_RESTORE_URL: postgresql://postgres:drillpass@127.0.0.1:5432/restore_test?sslmode=disable
        run: php artisan db:backup:restore --force

      - name: 4. Compare every table, restored copy against live
        env:
          LIVE_HOST: ${{ secrets.DB_HOST }}
          LIVE_PORT: ${{ secrets.DB_PORT }}
          LIVE_DB: ${{ secrets.DB_DATABASE }}
          LIVE_USER: ${{ secrets.DB_USERNAME }}
          LIVE_PASS: ${{ secrets.DB_PASSWORD }}
        run: |
          set -u
          scratch() { PGPASSWORD=drillpass psql -h 127.0.0.1 -p 5432 -U postgres -d restore_test -At -F '|' "$@"; }
          live()    { PGPASSWORD="$LIVE_PASS" PGSSLMODE=require psql -h "$LIVE_HOST" -p "$LIVE_PORT" -U "$LIVE_USER" -d "$LIVE_DB" -At -F '|' "$@"; }

          TABLES_SCRATCH=$(scratch -c "select table_name from information_schema.tables where table_schema='public' and table_type='BASE TABLE' order by 1")
          TABLES_LIVE=$(live -c "select table_name from information_schema.tables where table_schema='public' and table_type='BASE TABLE' order by 1")

          echo "Tables in restored copy: $(echo "$TABLES_SCRATCH" | wc -l)   Tables in live database: $(echo "$TABLES_LIVE" | wc -l)"
          if [ "$TABLES_SCRATCH" != "$TABLES_LIVE" ]; then
            echo "FAIL: the list of tables differs"; diff <(echo "$TABLES_LIVE") <(echo "$TABLES_SCRATCH") || true; exit 1
          fi

          # These change all the time (sessions, cache, queue, the audit trail gets new lines from the backup itself).
          VOLATILE=" sessions cache cache_locks jobs job_batches failed_jobs audit_logs "
          FAIL=0
          printf '%-34s %10s %10s  %s\n' TABLE RESTORED LIVE RESULT
          for t in $TABLES_LIVE; do
            q="select count(*), md5(coalesce(string_agg(x::text, '|' order by x::text), '')) from public.\"$t\" x"
            a=$(scratch -c "$q"); b=$(live -c "$q")
            ca=${a%%|*}; cb=${b%%|*}
            if [ "$a" = "$b" ]; then r="identical"
            elif [[ "$VOLATILE" == *" $t "* ]]; then r="differs (changes constantly, ignored)"
            else r="MISMATCH"; FAIL=1; fi
            printf '%-34s %10s %10s  %s\n' "$t" "$ca" "$cb" "$r"
          done

          USERS=$(scratch -c "select count(*) from public.users")
          echo "Users in restored copy: $USERS"
          [ "$USERS" -gt 0 ] || { echo "FAIL: no users in the restored copy"; exit 1; }
          [ "$FAIL" -eq 0 ] || { echo "FAIL: at least one table does not match"; exit 1; }
          echo "RESTORE DRILL PASSED: every table in the restored copy matches the live database."

      - name: 5. The restored copy works with the app (migrations and sign-in table)
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: restore_test
          DB_USERNAME: postgres
          DB_PASSWORD: drillpass
          DB_SSLMODE: disable
        run: |
          php artisan migrate:status | tail -n 8
          php artisan migrate --pretend --no-interaction | tail -n 3
